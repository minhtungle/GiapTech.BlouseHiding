name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GiapTech.BlouseHiding.slnx

      - name: Build
        run: dotnet build GiapTech.BlouseHiding.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test GiapTech.BlouseHiding.slnx --no-build --configuration Release
