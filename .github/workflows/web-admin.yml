name: Web Admin CI

on:
  push:
    branches: [main]
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-admin.yml'
  pull_request:
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-admin.yml'

defaults:
  run:
    working-directory: web-admin

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5100/api/v1
