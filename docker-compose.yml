name: giaptech-blousehiding-dev

# Hạ tầng dev cục bộ — self-host, không dùng managed cloud (ADR-0002).
# Backend .NET nối trực tiếp bằng connection string trong appsettings.Development.json,
# không dùng Aspire orchestration (xem ADR-0008 phần Giai đoạn 0.2 / ghi chú gỡ AppHost).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blousehiding
      POSTGRES_USER: blousehiding
      POSTGRES_PASSWORD: blousehiding_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blousehiding -d blousehiding"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: blousehiding
      RABBITMQ_DEFAULT_PASS: blousehiding_dev
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI — http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: blousehiding
      MINIO_ROOT_PASSWORD: blousehiding_dev
    ports:
      - "9000:9000" # API
      - "9001:9001" # console — http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
